<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韩语单词 · 不背单词式学习</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--p:#6c5ce7;--pd:#5a4bd1;--t:#2d3436;--s:#636e72;--l:#e4e7ef;--g:#00b894;--r:#d63031;--y:#fdcb6e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);min-height:100vh;}
header{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;padding:24px 16px;text-align:center;}
header h1{font-size:21px;margin-bottom:4px;}
header p{font-size:12px;opacity:.9;}
nav{display:flex;justify-content:center;gap:6px;padding:12px;background:var(--card);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--l);flex-wrap:wrap;}
nav button{border:none;background:#eef0f7;color:var(--s);padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;}
nav button.active{background:var(--p);color:#fff;}
main{max-width:720px;margin:0 auto;padding:18px 14px 70px;}
.hidden{display:none;}
.card{background:var(--card);border:1px solid var(--l);border-radius:14px;padding:16px;margin-bottom:12px;}
.btn{border:none;border-radius:10px;padding:12px 18px;font-size:15px;cursor:pointer;color:#fff;background:var(--p);}
.btn:hover{background:var(--pd);}
.btn.ghost{background:#eef0f7;color:var(--t);}
.btn.green{background:var(--g);} .btn.red{background:var(--r);}
.btn.small{padding:8px 14px;font-size:13px;}
.playbtn{border:none;background:var(--p);color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;flex-shrink:0;}
.playbtn:hover{background:var(--pd);}
.playbtn.mini{width:28px;height:28px;font-size:12px;background:#eef0f7;color:var(--p);}
/* 仪表盘 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.stat{background:var(--card);border:1px solid var(--l);border-radius:12px;padding:14px 8px;text-align:center;}
.stat .num{font-size:22px;font-weight:700;color:var(--p);}
.stat .lbl{font-size:12px;color:var(--s);margin-top:4px;}
.bigbtn{width:100%;padding:16px;font-size:17px;margin-bottom:10px;border-radius:14px;}
.progressbar{height:10px;background:#eef0f7;border-radius:99px;overflow:hidden;margin:8px 0;}
.progressbar>div{height:100%;background:linear-gradient(90deg,#6c5ce7,#00b894);border-radius:99px;transition:width .3s;}
/* 学习卡片 */
.studycard{background:var(--card);border:1px solid var(--l);border-radius:18px;padding:30px 20px;text-align:center;min-height:340px;display:flex;flex-direction:column;justify-content:center;gap:14px;}
.word-ko{font-size:38px;font-weight:700;}
.word-zh{font-size:20px;color:var(--g);font-weight:600;}
.word-ex{font-size:17px;line-height:1.8;background:#f8f9ff;border-radius:12px;padding:12px;}
.word-ex .zh{display:block;font-size:13px;color:var(--s);margin-top:4px;}
.grades{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px;}
.grades .btn{min-width:100px;}
.studymeta{display:flex;justify-content:space-between;font-size:13px;color:var(--s);margin-bottom:10px;}
/* 单词表 */
.toolbar{display:flex;gap:10px;margin-bottom:14px;}
.toolbar input{flex:1;padding:11px 14px;border:1px solid var(--l);border-radius:10px;font-size:14px;}
.witem{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--l);border-radius:12px;margin-bottom:8px;}
.witem .ko{font-size:18px;font-weight:600;}
.witem .zh{color:var(--s);font-size:14px;}
.witem .ex{flex:1;font-size:13px;color:var(--s);}
.badge-done{background:#e7f6f2;color:var(--g);font-size:11px;padding:2px 8px;border-radius:99px;}
/* 阅读 */
.ptoolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--l);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--s);}
.ptoolbar input[type=range]{flex:1;min-width:100px;}
.passage .body{font-size:17px;line-height:2;margin:10px 0;}
.passage .trans{font-size:13px;color:var(--s);line-height:1.8;border-top:1px dashed var(--l);padding-top:10px;}
.phead{display:flex;justify-content:space-between;align-items:center;}
h2.pt{font-size:17px;}
.daydone{text-align:center;padding:40px 0;color:var(--s);}
.daydone .big{font-size:20px;color:var(--t);margin-bottom:8px;}
</style>
</head>
<body>
<header><h1>🇰🇷 韩语单词 · 每日学习</h1><p>高频 1000 词 · 间隔重复 · 例句配音</p></header>
<nav>
  <button class="active" onclick="tab('home',this)">🏠 首页</button>
  <button onclick="tab('study',this)">📗 学新词</button>
  <button onclick="tab('review',this)">📕 复习 <span id="dueBadge"></span></button>
  <button onclick="tab('words',this)">📚 词表</button>
  <button onclick="tab('read',this)">📖 阅读</button>
</nav>
<main>
  <section id="home">
    <div class="stats">
      <div class="stat"><div class="num" id="stNew">0</div><div class="lbl">今日新词</div></div>
      <div class="stat"><div class="num" id="stDue">0</div><div class="lbl">待复习</div></div>
      <div class="stat"><div class="num" id="stLearned">0</div><div class="lbl">已学 / <span id="stTotal"></span></div></div>
      <div class="stat"><div class="num" id="stStreak">0</div><div class="lbl">连续天数 🔥</div></div>
    </div>
    <div class="card">
      <div style="font-size:13px;color:var(--s);margin-bottom:4px;">总进度</div>
      <div class="progressbar"><div id="progFill" style="width:0%"></div></div>
    </div>
    <button class="btn bigbtn" onclick="startStudy()">📗 开始学新词（每日 15 个）</button>
    <button class="btn green bigbtn" onclick="startReview()">📕 开始复习（<span id="dueCountBtn">0</span> 个到期）</button>
  </section>

  <section id="study" class="hidden">
    <div id="studyArea"></div>
  </section>

  <section id="review" class="hidden">
    <div id="reviewArea"></div>
  </section>

  <section id="words" class="hidden">
    <div class="toolbar">
      <input id="searchBox" placeholder="搜索韩语或中文…" oninput="renderWordList()">
    </div>
    <div id="wordList"></div>
  </section>

  <section id="read" class="hidden">
    <div class="ptoolbar">
      <button class="btn small" onclick="speak(PASSAGES[curP].body)">▶ 朗读</button>
      <button class="btn small red" onclick="stopSpeak()">■ 停止</button>
      <button class="btn small ghost" onclick="prevP()">‹ 上一篇</button>
      <span id="pIdx"></span>
      <button class="btn small ghost" onclick="nextP()">下一篇 ›</button>
      <label>语速 <span id="rateVal">0.9</span>x</label>
      <input type="range" min="0.5" max="1.2" step="0.1" value="0.9" oninput="setRate(this.value)">
    </div>
    <div class="card passage">
      <h2 class="pt" id="pTitle"></h2>
      <div class="body" id="pBody"></div>
      <div class="trans" id="pTrans"></div>
    </div>
  </section>
</main>

const PASSAGES = [{"title": "자기소개 · 自我介绍", "body": "안녕하세요! 저는 중국에서 온 학생입니다. 한국어를 공부한 지 석 달이 되었습니다. 매일 아침에 한국어 단어를 외웁니다. 한국어가 아주 재미있습니다. 열심히 공부하겠습니다. 감사합니다!", "trans": "大家好！我是从中国来的学生。学韩语已经三个月了。每天早上背韩语单词。韩语非常有趣。我会努力学习的。谢谢！"}, {"title": "나의 하루 · 我的一天", "body": "아침에 일곱 시에 일어납니다. 아침을 먹고 커피를 마십니다. 그리고 학교에 갑니다. 학교에서 친구들과 함께 공부합니다. 점심에 학교 식당에서 음식을 먹습니다. 음식이 맛있습니다. 저녁에 집에 가서 책을 읽습니다. 열한 시에 잠을 잡니다.", "trans": "早上七点起床。吃早饭、喝咖啡。然后去学校。在学校和朋友们一起学习。午饭在食堂吃饭。饭菜很好吃。晚上回家读书。十一点睡觉。"}, {"title": "한국어 공부 · 学韩语", "body": "왜 한국어를 공부합니까? 저는 한국 드라마를 좋아하기 때문입니다. 드라마를 볼 때마다 한국어를 조금씩 배웁니다. 처음에는 어려웠지만, 지금은 조금 할 수 있습니다. 매일 조금씩 공부하면 됩니다. 시간이 있을 때 단어도 외우고, 소리 내서 읽기도 합니다. 포기하지 않겠습니다!", "trans": "为什么学韩语呢？因为我喜欢韩剧。每次看剧都学到一点韩语。一开始很难，但现在会一点了。每天学一点就行。有空的时候背单词，也出声朗读。我不会放弃的！"}];
const DAILY_NEW = 15;
const INTERVALS = [10*60*1000, 86400000, 3*86400000, 7*86400000, 15*86400000, 30*86400000];
const LSKEY = 'korean_srs_v1';

let store = loadStore();
function loadStore(){
  try{ const s = JSON.parse(localStorage.getItem(LSKEY)); if(s && s.prog) return s; }catch(e){}
  return {prog:{}, day:'', newToday:0, streak:0, lastDay:''};
}
function save(){ localStorage.setItem(LSKEY, JSON.stringify(store)); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function checkNewDay(){
  const t = todayStr();
  if(store.day !== t){ store.day = t; store.newToday = 0; save(); }
}
checkNewDay();

/* ---------- TTS ---------- */
let rate=0.9, koVoice=null;
function loadVoices(){
  const vs = speechSynthesis.getVoices();
  koVoice = vs.find(v=>v.lang==='ko-KR') || vs.find(v=>v.lang&&v.lang.startsWith('ko')) || null;
}
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(t){ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang='ko-KR'; if(koVoice)u.voice=koVoice; u.rate=rate; speechSynthesis.speak(u); }
function stopSpeak(){ speechSynthesis.cancel(); }
function setRate(v){ rate=parseFloat(v); document.getElementById('rateVal').textContent=v; }

/* ---------- 导航 ---------- */
function tab(name, btn){
  stopSpeak();
  ['home','study','review','words','read'].forEach(x=>document.getElementById(x).classList.add('hidden'));
  document.getElementById(name).classList.remove('hidden');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(name==='home') renderHome();
  if(name==='words') renderWordList();
  if(name==='read') renderPassage();
}

/* ---------- 首页 ---------- */
function dueList(){
  const now = Date.now(); const out=[];
  for(const k in store.prog){ if(store.prog[k].due <= now) out.push(+k); }
  out.sort((a,b)=>store.prog[a].due - store.prog[b].due);
  return out;
}
function learnedCount(){ return Object.keys(store.prog).length; }
function renderHome(){
  checkNewDay();
  const due = dueList();
  document.getElementById('stNew').textContent = Math.max(0, DAILY_NEW - store.newToday);
  document.getElementById('stDue').textContent = due.length;
  document.getElementById('stLearned').textContent = learnedCount();
  document.getElementById('stTotal').textContent = WORDS.length;
  document.getElementById('stStreak').textContent = store.streak;
  document.getElementById('progFill').style.width = (learnedCount()/WORDS.length*100).toFixed(1)+'%';
  document.getElementById('dueCountBtn').textContent = due.length;
  document.getElementById('dueBadge').textContent = due.length ? '('+due.length+')' : '';
}

/* ---------- 学新词 ---------- */
let sess = null;
function newWordIndices(){
  const out=[];
  for(let i=0;i<WORDS.length;i++){ if(!store.prog[i]) out.push(i); }
  return out;
}
function startStudy(){
  checkNewDay();
  const remain = DAILY_NEW - store.newToday;
  const fresh = newWordIndices();
  if(remain <= 0){ alert('今天的新词学完了，去复习吧！'); return; }
  if(!fresh.length){ alert('全部单词都学过了！'); return; }
  sess = { mode:'study', queue: fresh.slice(0, Math.min(remain, fresh.length)), idx:0, counts:{good:0,hard:0,again:0}, revealed:false };
  tab('study', document.querySelectorAll('nav button')[1]);
  renderCard();
}
function startReview(){
  checkNewDay();
  const due = dueList();
  if(!due.length){ alert('没有到期的复习词，先去学新词吧！'); return; }
  sess = { mode:'review', queue: due, idx:0, counts:{good:0,hard:0,again:0}, revealed:false };
  tab('review', document.querySelectorAll('nav button')[2]);
  renderCard();
}

function renderCard(){
  const area = document.getElementById(sess.mode==='study' ? 'studyArea' : 'reviewArea');
  if(sess.idx >= sess.queue.length){
    finishSession(area); return;
  }
  const wi = sess.queue[sess.idx];
  const w = WORDS[wi];
  const total = sess.queue.length;
  const isNew = !store.prog[wi] || sess.mode==='study';
  let html = `<div class="studymeta"><span>${sess.mode==='study'?'学新词':'复习'} · 第 ${sess.idx+1} / ${total} 个</span><button class="btn small ghost" onclick="quitSession()">结束</button></div>`;
  html += `<div class="studycard">`;
  html += `<div style="display:flex;justify-content:center;gap:10px;align-items:center;"><button class="playbtn" onclick="speak(WORDS[${wi}].ko)">🔊</button></div>`;
  html += `<div class="word-ko">${w.ko}</div>`;
  if(!sess.revealed){
    html += `<div style="color:var(--s);font-size:14px;">先想一想，认识这个词吗？</div>`;
    html += `<div class="grades">
      <button class="btn green" onclick="revealCard()">我认识</button>
      <button class="btn red" onclick="revealCard()">不认识 / 看答案</button>
    </div>`;
  } else {
    html += `<div class="word-zh">${w.zh}</div>`;
    html += `<div class="word-ex"><div style="display:flex;justify-content:center;gap:8px;align-items:center;"><button class="playbtn mini" onclick="speak(WORDS[${wi}].ex)">🔊</button><span>${w.ex}</span></div><span class="zh">${w.exZh}</span></div>`;
    html += `<div class="grades">
      <button class="btn red" onclick="grade('again')">😣 不认识</button>
      <button class="btn" style="background:var(--y);color:#333;" onclick="grade('hard')">😐 模糊</button>
      <button class="btn green" onclick="grade('good')">😄 认识</button>
    </div>`;
  }
  html += `</div>`;
  area.innerHTML = html;
  speak(w.ko);
}
function revealCard(){ sess.revealed = true; renderCard(); speak(WORDS[sess.queue[sess.idx]].ex); }

function grade(g){
  const wi = sess.queue[sess.idx];
  const now = Date.now();
  const p = store.prog[wi] || {lvl:0};
  const isFresh = !store.prog[wi];
  let lvl;
  if(g==='again'){ lvl = 0; }
  else if(g==='hard'){ lvl = isFresh ? 0 : Math.max(1, p.lvl); }
  else { lvl = isFresh ? 1 : Math.min(p.lvl+1, INTERVALS.length-1); }
  store.prog[wi] = {lvl: lvl, due: now + INTERVALS[lvl]};
  if(isFresh){ store.newToday++; }
  sess.counts[g]++;
  save();
  sess.revealed = false;
  if(g==='again' && sess.mode==='review'){
    sess.queue.push(wi); // 重新排队
  }
  sess.idx++;
  renderCard();
}

function finishSession(area){
  const c = sess.counts;
  const studied = c.good + c.hard + c.again;
  // 连续天数
  const t = todayStr();
  if(store.lastDay !== t){
    const y = new Date(Date.now()-86400000);
    const ys = y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    store.streak = (store.lastDay === ys) ? store.streak + 1 : 1;
    store.lastDay = t;
    save();
  }
  area.innerHTML = `<div class="card daydone">
    <div class="big">🎉 完成！本次${sess.mode==='study'?'学习':'复习'} ${studied} 个单词</div>
    <div>😄 认识 ${c.good} · 😐 模糊 ${c.hard} · 😣 不认识 ${c.again}</div>
    <div style="margin-top:6px;">🔥 连续学习 ${store.streak} 天</div>
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;">
      <button class="btn" onclick="tab('home',document.querySelectorAll('nav button')[0])">回首页</button>
      <button class="btn green" onclick="startReview()">去复习</button>
    </div></div>`;
  sess = null;
  renderHome();
}
function quitSession(){ sess=null; stopSpeak(); tab('home', document.querySelectorAll('nav button')[0]); }

/* ---------- 词表 ---------- */
function renderWordList(){
  const q = (document.getElementById('searchBox').value||'').trim().toLowerCase();
  let html='';
  for(let i=0;i<WORDS.length;i++){
    const w = WORDS[i];
    if(q && !(w.ko.includes(q) || w.zh.toLowerCase().includes(q))) continue;
    const done = store.prog[i] ? '<span class="badge-done">已学</span>' : '';
    html += `<div class="witem">
      <button class="playbtn mini" onclick="speak(WORDS[${i}].ko)">🔊</button>
      <span class="ko">${w.ko}</span><span class="zh">${w.zh}</span>${done}
      <span class="ex">${w.ex}｜${w.exZh}</span>
    </div>`;
  }
  document.getElementById('wordList').innerHTML = html || '<div style="text-align:center;color:var(--s);padding:30px;">没有找到</div>';
}

/* ---------- 阅读 ---------- */
let curP = 0;
function renderPassage(){
  const p = PASSAGES[curP];
  document.getElementById('pTitle').textContent = p.title;
  document.getElementById('pBody').textContent = p.body;
  document.getElementById('pTrans').textContent = p.trans;
  document.getElementById('pIdx').textContent = (curP+1)+' / '+PASSAGES.length;
}
function prevP(){ curP = (curP-1+PASSAGES.length)%PASSAGES.length; renderPassage(); }
function nextP(){ curP = (curP+1)%PASSAGES.length; renderPassage(); }

renderHome();
</script>
</body>
</html>
